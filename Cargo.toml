[workspace]
resolver = "3"
members  = ["compiler/*"]
default-members = ["compiler/etac"]

[workspace.lints.clippy]
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Skylar Abruzese"]

[workspace.dependencies]
# external
logos 			= { git = "https://github.com/maciejhirsz/logos", branch = "master" }
ariadne         	= "0.6"
clap            	= { version = "4.5", features = ["derive"] }
elsa 			= "1.11.2"
dashmap 		= "6.2.1"
crossbeam-skiplist 	= "0.1.3"
lasso 			= { version = "0.7", features = ["multi-threaded"] }
rustc-hash 		= "2"
indenter		= { version = "0.3.4", features = ["std"] }
paste 			= "1.0.15"
stacker			= "0.1"

# internal
etac_ast      		= { path = "compiler/etac_ast" }
etac_cli      		= { path = "compiler/etac_cli" }
etac_driver   		= { path = "compiler/etac_driver" }
etac_errors   		= { path = "compiler/etac_errors" }
etac_intern		= { path = "compiler/etac_intern" }
etac_lexer    		= { path = "compiler/etac_lexer" }
etac_parse    		= { path = "compiler/etac_parse" }
etac_session  		= { path = "compiler/etac_session" }
etac_source 		= { path = "compiler/etac_source" }
etac_resolve  		= { path = "compiler/etac_resolve" }
etac_frontend		= { path = "compiler/etac_frontend" }
etac_stack		= { path = "compiler/etac_stack" }

# debug / testing
etac_debug      = { path = "compiler/etac_debug" }
expect-test 	= "1.5.1"
indoc 		= "2"
